# Gochi API — Render blueprint (PLAN P14, hackathon submission).
#
# Native Node runtime, NOT Docker. The server runs TypeScript directly through
# `tsx`, which is a real dependency, so there is no build step and no image to
# maintain — nothing to install locally either.
#
# This was rehearsed before being written down: a clean checkout with a
# production-only install booted and answered /health with 200 using the exact
# commands below.
#
# Two non-obvious things, both learned the hard way:
#
# 1. The mobile workspace must stay committed. Root package.json declares
#    `workspaces: ["mobile", "apps/*", "packages/*"]`, and npm needs every
#    workspace's package.json present to build the dependency tree — even the
#    ones it will not install. `--workspace` then restricts the install to the
#    API and its contracts, so React Native's dependencies are never installed
#    server-side.
#
# 2. `tsx` must NOT also be a devDependency. npm treats a package listed in both
#    as dev, so `--omit=dev` drops it and the server dies with "tsx not found".
services:
  - type: web
    name: gochi-mobile
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev --workspace @gochi/api --workspace @gochi/contracts --include-workspace-root
    startCommand: npm run start --workspace @gochi/api
    healthCheckPath: /health

    envVars:
      # Pinned for reproducibility. The local rehearsal ran on Node 24; 22 is
      # the conservative LTS. Bump if the runtime complains.
      - key: NODE_VERSION
        value: "22"

      # Neon. Direct for migrations (DDL needs a pinned session), pooled for the
      # running server — Neon poolers drop idle server-side connections.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLED
        sync: false

      # Session signing. Generate with: openssl rand -base64 48
      - key: API_JWT_SECRET
        sync: false

      # Privy. The App ID is public by design and ships in the APK, which is why
      # the EXPO_PUBLIC_ prefix is correct here. There is no app secret: token
      # verification checks the signature against Privy's published JWKS, so the
      # server never makes an authenticated call and never needed one.
      - key: EXPO_PUBLIC_PRIVY_APP_ID
        sync: false

      # Solana. Writes stay on devnet: the companion mint is the only write, and
      # spending devnet keeps mainnet untouched.
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com

      # Every READ, and it must be mainnet: the user's wallet history and token
      # balances live there, and so do the Seeker Genesis Token and .skr records.
      # Reading any of those from devnet returns confident wrong answers rather
      # than errors. Helius rather than the public endpoint because the public one
      # rate-limits and intermittently drops getSignaturesForAddress, which would
      # leave the companion inert with no visible cause.
      - key: SOLANA_MAINNET_RPC_URL
        value: https://mainnet.helius-rpc.com/?api-key=d9c9b9c3-f9cb-4ee1-9e6d-6140666315f8

      # Helius dashboard key. NOT required for ingestion: activity is read through
      # SOLANA_MAINNET_RPC_URL by the RPC adapter. This key only backs the webhook
      # adapter, which is an unfinished stub and is never selected.
      - key: HELIUS_API_KEY
        sync: false

      # The mint payer's keypair as base64, because a host has no keypair *file*
      # and baking one into an image would put a funded wallet into git history.
      # A Solana keyfile is a JSON array of 64 bytes, so this is base64 of that
      # JSON text — 300 characters, not 88. Generate with:
      #   base64 -w0 /home/bigben/.config/solana/id.json
      # Same value as in apps/api/.env. Without it, companion creation returns
      # mint_unavailable.
      - key: PAYER_SECRET_KEY_BASE64
        sync: false