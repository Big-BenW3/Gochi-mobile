<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout reaches under a notch on Android; the
         header compensates with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Only the two faces used above the fold are preloaded. Preloading all
         four would spend bandwidth on weights the first screen never renders. -->
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-SemiBold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Manrope-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <title>Gochi — a companion that reacts to your moves on Solana</title>
    <meta
      name="description"
      content="Gochi is a persistent companion on Solana Mobile. It reads your real onchain activity and changes because of it."
    />

    <!--
      OG image is rendered from the 3D scene later and lands in /public. The tag
      is here now so the URL contract exists before the asset does, rather than
      being retrofitted.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gochi — a companion that reacts to your moves on Solana" />
    <meta
      property="og:description"
      content="A persistent companion whose state and personality are driven by your real onchain activity."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#05060D" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
