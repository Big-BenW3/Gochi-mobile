<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gochi">
  <!--
    LOGO 1 — "Signal"
    A single geometric mark: an upward spark with a soft aura behind it.
    Reads as a single crisp shape at 16px, so it survives a favicon.
    Palette: app tokens only.
  -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A6BFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7A6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7A6BFF"/>
      <stop offset="100%" stop-color="#31D6FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#05060D"/>
  <circle cx="256" cy="268" r="196" fill="url(#aura)"/>

  <!-- the spark: a rounded lozenge that tapers to a point, leaning upward -->
  <path d="M256 96
           C286 150 316 190 330 232
           C341 266 330 300 306 318
           C288 331 262 334 240 322
           C212 307 200 274 210 240
           C222 200 240 148 256 96 Z"
        fill="url(#spine)"/>

  <!-- an inner cut so the mark has a hollow centre and reads as a glyph, not a blob -->
  <path d="M256 158
           C266 184 274 205 276 226
           C278 244 272 258 260 266
           C249 273 236 271 228 262
           C218 251 219 236 224 218
           C231 194 245 174 256 158 Z"
        fill="#05060D" opacity="0.92"/>

  <!-- two orbiting dots: the wallet and the chain, implied -->
  <circle cx="150" cy="366" r="15" fill="#31D6FF"/>
  <circle cx="366" cy="160" r="10" fill="#7A6BFF"/>
</svg>