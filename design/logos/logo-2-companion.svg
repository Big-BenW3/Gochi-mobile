<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gochi">
  <!--
    LOGO 2 — "Companion"
    The creature itself, reduced to a silhouette: two ears and a rounded head.
    The most characterful of the three and the one that ties to a 3D hero model,
    so it is the safer pick if the landing page leads with the companion.
    Palette: app tokens only.
  -->
  <defs>
    <linearGradient id="shell" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#A99BFF"/>
      <stop offset="55%" stop-color="#7A6BFF"/>
      <stop offset="100%" stop-color="#4B3FD6"/>
    </linearGradient>
    <linearGradient id="shellIn" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#EDEFF9"/>
      <stop offset="100%" stop-color="#A8B0CC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#31D6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#31D6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#05060D"/>
  <ellipse cx="256" cy="286" rx="178" ry="172" fill="url(#glow)"/>

  <!-- ears: tapered, angled outward, with an inner ear -->
  <path d="M186 214 C168 168 158 128 164 100 C169 76 186 80 202 102
           C226 136 240 172 244 206 Z" fill="url(#shell)"/>
  <path d="M326 214 C344 168 354 128 348 100 C343 76 326 80 310 102
           C286 136 272 172 268 206 Z" fill="url(#shell)"/>
  <path d="M196 196 C186 166 180 142 184 126 C187 114 196 116 204 130
           C218 152 226 174 228 194 Z" fill="url(#shellIn)" opacity="0.85"/>
  <path d="M316 196 C326 166 332 142 328 126 C325 114 316 116 308 130
           C294 152 286 174 284 194 Z" fill="url(#shellIn)" opacity="0.85"/>

  <!-- head: a wide dome tapering to a soft muzzle -->
  <path d="M256 150
           C334 150 388 210 388 280
           C388 340 348 386 296 392
           C284 394 274 393 268 391
           C262 393 252 394 240 392
           C188 386 148 340 148 280
           C148 210 202 150 256 150 Z"
        fill="url(#shell)"/>

  <!-- visor: one continuous band across both eyes, the signature detail -->
  <path d="M186 272 C212 254 300 254 326 272
           C334 278 334 292 324 299
           C304 312 208 312 188 299
           C178 292 178 278 186 272 Z"
        fill="#05060D"/>
  <circle cx="212" cy="284" r="13" fill="#31D6FF"/>
  <circle cx="300" cy="284" r="13" fill="#31D6FF"/>

  <!-- reward-gold collar: the level band, one accent so it reads as earned -->
  <path d="M196 352 C226 366 286 366 316 352
           C320 348 320 360 316 364
           C286 380 226 380 196 364
           C192 360 192 348 196 352 Z"
        fill="#FFC24B"/>
</svg>