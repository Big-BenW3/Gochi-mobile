<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gochi">
  <!--
    LOGO 3 — "Core"
    An onchain asset, not a creature. Concentric rings with a single seeded core
    and a transaction orbiting it. This is the most technical of the three and the
    clearest statement that the companion is a real, ownable Solana asset —
    the strongest choice if the judges' takeaway should be "it's actually onchain".
    Palette: app tokens only.
  -->
  <defs>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#EDEFF9"/>
      <stop offset="45%" stop-color="#31D6FF"/>
      <stop offset="100%" stop-color="#2B8FD8"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A99BFF"/>
      <stop offset="100%" stop-color="#7A6BFF"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31D6FF"/>
      <stop offset="100%" stop-color="#4B3FD6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#05060D"/>

  <!-- outer ring: broken, so it reads as a ring rather than a flat disc -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring1)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="812 294" transform="rotate(-28 256 256)"/>

  <!-- inner ring, counter-rotating, thinner -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#ring2)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="520 284" transform="rotate(46 256 256)"/>

  <!-- the seeded core -->
  <circle cx="256" cy="256" r="72" fill="url(#core)"/>
  <circle cx="256" cy="256" r="72" fill="none" stroke="#05060D" stroke-width="6" opacity="0.35"/>

  <!-- the companion's own highlight, kept off-centre like a lit sphere -->
  <ellipse cx="228" cy="224" rx="24" ry="16" fill="#FFFFFF" opacity="0.55"
           transform="rotate(-28 228 224)"/>

  <!-- the orbiting transaction -->
  <circle cx="392" cy="152" r="26" fill="#FFC24B"/>
  <circle cx="392" cy="152" r="26" fill="none" stroke="#05060D" stroke-width="5" opacity="0.4"/>

  <!-- two settled blocks behind, small and quiet -->
  <circle cx="124" cy="330" r="13" fill="#FF6EDB" opacity="0.9"/>
  <circle cx="150" cy="392" r="8" fill="#7A6BFF" opacity="0.8"/>
</svg>